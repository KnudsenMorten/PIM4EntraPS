<!-- subject: [PIM Alert] {{AlertTitle}} -->
<!-- tokens: AlertTable, AlertTitle, AlertCustomer, AlertEnvironment, AlertSolution, AlertWho, AlertStatus, AlertProblem, AlertTodo, AlertFindingRows, AlertWhen, AlertSupport, AlertDetail, AlertTab -->
<!-- The alert mail is ONE table (labels left, values bold), in this order: Customer, Environment, Solution, Who acts, Status, Problem, What to do, the findings (one row each: kind and name), When, Support. AlertTable is that whole table, built by the product for every alert (New-PimAlertMailTable in engine/_shared/PIM-MailLayout.ps1); the button that opens the right PIM Manager page and the footer are added after it. The other tokens carry the same values one by one, for a template you write yourself (AlertFindingRows = ready table rows). -->
<!-- Sent to the alerting recipients configured in PIM Manager (Home/Settings > Alerting) when a subscribed event fires (a job that failed, a change a safety check held back, drift, expiring access, new findings on Discovery and gaps, break-glass use). To customize: edit it in PIM Manager (Settings > Mail templates); the edited copy is kept in SQL and is never overwritten by updates. -->
<html>
<!-- FONT: a multi-word family MUST be quoted ('Segoe UI'), and Outlook does NOT inherit font-family into table cells. Every cell of the table carries the family itself. -->
<body style="margin:0; padding:0; background:#f6f8fa;">
  <div style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif; color:#24292f; font-size:14px; line-height:1.5; max-width:680px; margin:0 auto;">
    {{AlertTable}}
  </div>
</body>
</html>
