<!-- subject: {{AlertSubject}} -->
<!-- tokens: AlertTable, AlertSubject, AlertHeading, AlertSummary, AlertTitle, AlertCustomer, AlertEnvironment, AlertSolution, AlertWho, AlertStatus, AlertProblem, AlertTodo, AlertFindingRows, AlertWhen, AlertSupport, AlertDetail, AlertTab -->
<!-- AlertTable is the WHOLE alert mail, built by the product for every alert (New-PimEventMail in engine/_shared/PIM-MailLayout.ps1): logo, "PIM Manager for <environment> - <topic>", a short calm summary (a safety check opens with "For your information:" or "Please take a look:" and answers "Should you be worried? / Was anything changed? / Do you need to do anything?"), the facts (Environment, Product, Job, When, Items affected), each cause with what to do, ONE button that opens the right PIM Manager page, Details for support, and the footer. AlertSubject is "<environment>: <the event, in plain words>". The other tokens carry single values, for a template you write yourself (AlertFindingRows = ready table rows). -->
<!-- Sent to the alerting recipients configured in PIM Manager (Home/Settings > Alerting) when a subscribed event fires (a job that failed, a change a safety check held back, drift, expiring access, new findings on Discovery and gaps, break-glass use). To customize: edit it in PIM Manager (Settings > Mail templates); the edited copy is kept in SQL and is never overwritten by updates. -->
<html>
<!-- FONT: a multi-word family MUST be quoted ('Segoe UI'), and Outlook does NOT inherit font-family into table cells. Every cell of the table carries the family itself. -->
<body style="margin:0; padding:0; background:#f6f8fa;">
  <div style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif; color:#24292f; font-size:14px; line-height:1.5; max-width:680px; margin:0 auto;">
    {{AlertTable}}
  </div>
</body>
</html>
