<!-- §82 RFA + consultant lifecycle: every mail to a person OUTSIDE IT -- a consultant (PIN, request received, approved,
     denied, expired, enabled, window ending, disabled), a company contact (review request, reminder) and a department
     Owner (an access request to decide). RFA-MAIL-2 (owner 2026-11-25): the mail leads with the company name, names the
     admin account to sign in with, lists the facts and the next steps, and carries one button (the access portal for
     the requester, Access requests in PIM Manager for an owner). The RfaMailHtml token is that whole mail; a sender that
     passes only Headline / Detail / Action gets the same layout. To customize: edit it in the Manager (Settings > Mail
     templates); the edited copy is kept in SQL. -->
